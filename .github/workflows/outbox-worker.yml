name: Taskly Customer Support - Zero-Cost Outbox Worker

'on':
  schedule:
    # Trigger every 30 minutes (well within GitHub Actions free runner quota)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to perform (process, sweep, or metrics)'
        required: true
        default: 'process'
        type: choice
        options:
          - process
          - sweep
          - metrics

jobs:
  outbox-worker:
    name: Process Support Email Outbox (₹0 Zero-Cost)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Execute Outbox Operation
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://taskly-todo-app-4z1c.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ACTION: ${{ github.event.inputs.action || 'process' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error ::CRON_SECRET is not configured in repository secrets. Outbox operation aborted."
            exit 1
          fi

          case "$ACTION" in
            process)
              ENDPOINT="/api/internal/support/outbox/process"
              HTTP_METHOD="POST"
              ;;
            sweep)
              ENDPOINT="/api/internal/support/outbox/sweep"
              HTTP_METHOD="POST"
              ;;
            metrics)
              ENDPOINT="/api/internal/support/outbox/metrics"
              HTTP_METHOD="GET"
              ;;
            *)
              echo "::error ::Unsupported action: $ACTION"
              exit 1
              ;;
          esac

          echo "Executing $HTTP_METHOD on $APP_URL$ENDPOINT..."

          if [ "$HTTP_METHOD" = "POST" ]; then
            HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              -X POST "$APP_URL$ENDPOINT" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")
          else
            HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              -X GET "$APP_URL$ENDPOINT" \
              -H "Authorization: Bearer $CRON_SECRET")
          fi

          echo "HTTP Status Code: $HTTP_STATUS"
          if [ -f /tmp/response.json ]; then
            cat /tmp/response.json
            echo ""
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error ::Operation '$ACTION' failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

          echo "Operation '$ACTION' completed successfully (HTTP $HTTP_STATUS)."

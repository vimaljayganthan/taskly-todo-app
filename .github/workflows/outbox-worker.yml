name: Taskly Customer Support - Zero-Cost Outbox Worker

on:
  schedule:
    # Trigger every 30 minutes (well within GitHub Actions free runner quota)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to perform (process, sweep, or metrics)'
        required: true
        default: 'process'
        type: choice
        options:
          - process
          - sweep
          - metrics

jobs:
  outbox-worker:
    name: Process Support Email Outbox (₹0 Zero-Cost)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Outbox Processing Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://taskly-todo-app-4z1c.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ACTION: ${{ github.event.inputs.action || 'process' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning ::CRON_SECRET is not configured in repository secrets. Skipping outbox run."
            exit 0
          fi

          ENDPOINT="/api/internal/support/outbox/$ACTION"
          echo "Triggering $APP_URL$ENDPOINT..."
          
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$APP_URL$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          echo "HTTP Status Code: $HTTP_STATUS"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error ::Failed to trigger outbox worker: HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Outbox worker triggered successfully."


name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'

# Least Privilege Permissions required for Workload Identity Federation (WIF)
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: taskly-app
  REGION: asia-south1
  GAR_REPOSITORY: taskly-repo

jobs:
  deploy:
    name: Build & Deploy to Cloud Run (Mumbai)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Secure Workload Identity Federation (Zero Long-Lived Service Account Keys)
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Tag Container Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Deploy to Cloud Run (Mumbai - asia-south1)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --max-instances=5
            --min-instances=0
            --memory=512Mi
            --cpu=1
            --service-account=${{ secrets.GCP_RUNTIME_SA }}
            --set-env-vars=NODE_ENV=production,DATA_STORE=firestore,GCP_PROJECT_ID=${{ env.PROJECT_ID }}

      - name: Verify Cloud Run Service Health
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Deployed service URL: $SERVICE_URL"
          echo "Probing /healthz endpoint..."
          curl -fail -s "$SERVICE_URL/healthz" | grep -q '"status":"UP"' || {
            echo "Healthcheck failed after deployment!"
            exit 1
          }
          echo "Healthcheck passed: Cloud Run service is UP and healthy."

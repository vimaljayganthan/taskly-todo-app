name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Integrity Validation
        run: |
          node -c server.js
          node -c api/index.js
          node -c public/app.js
          node -c storage/taskStore.js
          node -c scripts/migrate-to-firestore.js
          node -c scripts/migrate-to-supabase.js

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Docker Container Build
        run: |
          docker build -t taskly-app:test .

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#3D1C0B" flood-opacity="0.10"/>
    </filter>
  </defs>
  <g id="dog_full" filter="url(#shadow1)">
    <!-- Decorative Warm Paw Prints (Subtle background accents) -->
    <g fill="#FADBC8" opacity="0.85">
      <!-- Left paw print -->
      <ellipse cx="260" cy="780" rx="36" ry="46" transform="rotate(-20 260 780)"/>
      <circle cx="210" cy="700" r="16"/>
      <circle cx="250" cy="670" r="18"/>
      <circle cx="300" cy="685" r="16"/>
      <circle cx="330" cy="730" r="14"/>
      <!-- Right paw print -->
      <ellipse cx="1780" cy="740" rx="36" ry="46" transform="rotate(20 1780 740)"/>
      <circle cx="1710" cy="690" r="14"/>
      <circle cx="1740" cy="645" r="16"/>
      <circle cx="1790" cy="630" r="18"/>
      <circle cx="1830" cy="660" r="16"/>
    </g>

    <!-- Wagging Tail (right) -->
    <path d="M 1360 1320 C 1560 1280 1680 1080 1640 920 C 1600 880 1520 900 1500 980 C 1480 1100 1400 1200 1280 1280 Z"
          fill="#82441D" stroke="#3D1C0B" stroke-width="40" stroke-linejoin="round"/>

    <!-- Hind Haunches Sitting -->
    <ellipse cx="640" cy="1480" rx="180" ry="120" fill="#E89E53" stroke="#3D1C0B" stroke-width="40"/>
    <ellipse cx="1408" cy="1480" rx="180" ry="120" fill="#E89E53" stroke="#3D1C0B" stroke-width="40"/>

    <!-- Dog Body (rounded pear) -->
    <path d="M 720 980 C 680 1240 660 1520 820 1600 C 920 1640 1128 1640 1228 1600 C 1388 1520 1368 1240 1328 980 Z"
          fill="#E89E53" stroke="#3D1C0B" stroke-width="40" stroke-linejoin="round"/>

    <!-- Cream Belly / Chest Patch -->
    <path d="M 860 1040 C 860 1340 900 1560 1024 1560 C 1148 1560 1188 1340 1188 1040 Z"
          fill="#FFF6ED" stroke="#3D1C0B" stroke-width="36" stroke-linejoin="round"/>

    <!-- Front Legs and Paws Side by Side -->
    <!-- Left Leg -->
    <path d="M 820 1260 L 820 1580 C 820 1640 940 1640 940 1580 L 940 1260 Z"
          fill="#E89E53" stroke="#3D1C0B" stroke-width="36" stroke-linejoin="round"/>
    <ellipse cx="880" cy="1600" rx="72" ry="48" fill="#FFF6ED" stroke="#3D1C0B" stroke-width="36"/>
    <path d="M 860 1600 L 860 1636 M 900 1600 L 900 1636" stroke="#3D1C0B" stroke-width="24" stroke-linecap="round"/>

    <!-- Right Leg -->
    <path d="M 1108 1260 L 1108 1580 C 1108 1640 1228 1640 1228 1580 L 1228 1260 Z"
          fill="#E89E53" stroke="#3D1C0B" stroke-width="36" stroke-linejoin="round"/>
    <ellipse cx="1168" cy="1600" rx="72" ry="48" fill="#FFF6ED" stroke="#3D1C0B" stroke-width="36"/>
    <path d="M 1148 1600 L 1148 1636 M 1188 1600 L 1188 1636" stroke="#3D1C0B" stroke-width="24" stroke-linecap="round"/>

    <!-- Floppy Brown Ears (framing head) -->
    <!-- Left Ear -->
    <path d="M 660 500 C 400 540 320 820 380 1060 C 420 1220 560 1260 660 1160 C 740 1080 780 880 760 700 Z"
          fill="#82441D" stroke="#3D1C0B" stroke-width="44" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 620 620 C 460 700 420 880 460 1040 C 490 1120 570 1140 630 1080 C 680 1000 710 860 690 730 Z"
          fill="#6B3412"/>

    <!-- Right Ear -->
    <path d="M 1388 500 C 1648 540 1728 820 1668 1060 C 1628 1220 1488 1260 1388 1160 C 1308 1080 1268 880 1288 700 Z"
          fill="#82441D" stroke="#3D1C0B" stroke-width="44" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 1428 620 C 1588 700 1628 880 1588 1040 C 1558 1120 1478 1140 1418 1080 C 1368 1000 1338 860 1358 730 Z"
          fill="#6B3412"/>

    <!-- Head Base (Golden Caramel) -->
    <ellipse cx="1024" cy="760" rx="440" ry="380" fill="#E89E53" stroke="#3D1C0B" stroke-width="44"/>

    <!-- Cheeks Blush -->
    <ellipse cx="720" cy="820" rx="72" ry="44" fill="#FF9480" opacity="0.45"/>
    <ellipse cx="1328" cy="820" rx="72" ry="44" fill="#FF9480" opacity="0.45"/>

    <!-- White Blaze & Muzzle (Flowing from forehead down to muzzle) -->
    <path d="M 960 480 C 920 600 780 660 780 820 C 780 1000 900 1100 1024 1100 C 1148 1100 1268 1000 1268 820 C 1268 660 1128 600 1088 480 Z"
          fill="#FFF6ED" stroke="#3D1C0B" stroke-width="36" stroke-linejoin="round"/>

    <!-- Black Button Nose -->
    <path d="M 948 730 C 948 690 984 670 1024 670 C 1064 670 1100 690 1100 730 C 1100 780 1060 810 1024 810 C 988 810 948 780 948 730 Z"
          fill="#221108"/>
    <ellipse cx="1000" cy="710" rx="24" ry="12" fill="#FFFFFF" opacity="0.85" transform="rotate(-15 1000 710)"/>

    <!-- Smiling Mouth with Pink Tongue -->
    <path d="M 1024 810 L 1024 870" stroke="#3D1C0B" stroke-width="28" stroke-linecap="round"/>
    <path d="M 900 860 Q 1024 1000 1148 860 Q 1024 920 900 860 Z"
          fill="#8B2520" stroke="#3D1C0B" stroke-width="28" stroke-linejoin="round"/>
    <path d="M 952 890 Q 1024 990 1096 890 Z" fill="#FF757B"/>

    <!-- Cartoon Eyes -->
    <ellipse cx="828" cy="680" rx="48" ry="68" fill="#221108"/>
    <circle cx="812" cy="656" r="20" fill="#FFFFFF"/>
    <circle cx="848" cy="700" r="10" fill="#FFFFFF"/>
    <ellipse cx="820" cy="570" rx="28" ry="16" fill="#82441D" transform="rotate(-10 820 570)"/>

    <ellipse cx="1220" cy="680" rx="48" ry="68" fill="#221108"/>
    <circle cx="1204" cy="656" r="20" fill="#FFFFFF"/>
    <circle cx="1240" cy="700" r="10" fill="#FFFFFF"/>
    <ellipse cx="1228" cy="570" rx="28" ry="16" fill="#82441D" transform="rotate(10 1228 570)"/>

    <!-- Red Collar with Gold Circular Tag -->
    <path d="M 800 1060 Q 1024 1140 1248 1060 L 1256 1150 Q 1024 1250 792 1150 Z"
          fill="#E34338" stroke="#3D1C0B" stroke-width="36" stroke-linejoin="round"/>
    <circle cx="1024" cy="1210" r="60" fill="#F3AF19" stroke="#3D1C0B" stroke-width="28"/>
    <circle cx="1024" cy="1210" r="40" fill="#FDD835"/>
    <circle cx="1010" cy="1195" r="10" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>